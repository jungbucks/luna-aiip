<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>런칭! 나의 첫 AI 아이돌 — IP를 지켜라</title>
<meta name="description" content="AI 버추얼 아이돌 스타트업 대표가 되어 저작권·특허·상표·영업비밀·초상권·퍼블리시티권 딜레마를 겪는 교육 게임">
<meta name="theme-color" content="#0b0e22">
<!-- 모드 선적용(첫 화면이 반대 색으로 번쩍이지 않게) + 프로브용 오류 수집. 모듈보다 먼저 돈다. -->
<script>(function(){var p;try{p=localStorage.getItem('luna_theme')}catch(e){}
if(p!=='light'&&p!=='dark')p=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=p;
window.__errs=[];addEventListener('error',function(e){__errs.push(e.message)});addEventListener('unhandledrejection',function(e){__errs.push(String(e.reason))});})();</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/phone.css">
<link rel="stylesheet" href="css/ourlog.css">
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/engine.js">
<link rel="modulepreload" href="js/state.js">
<link rel="modulepreload" href="js/ui/chat.js">
<link rel="modulepreload" href="js/ui/popup.js">
<link rel="modulepreload" href="js/ui/ending.js">
<link rel="modulepreload" href="js/ui/character.js">
<link rel="modulepreload" href="js/ui/theme.js">
<link rel="modulepreload" href="js/ui/phone.js">
<link rel="modulepreload" href="js/ui/settings.js">
<link rel="modulepreload" href="js/ui/notebook.js">
<link rel="modulepreload" href="js/notes.js">
<link rel="modulepreload" href="js/ui/ourlog.js">
<link rel="modulepreload" href="js/ourlog-feed.js">
<link rel="modulepreload" href="data/episodes.js">
<link rel="modulepreload" href="data/strings.js">
</head>
<body>
<div class="device">
<div id="app" class="screen">

  <!-- 폰 껍데기(기기 틀 모드에서만 보임 — 실제 폰에서는 숨김) -->
  <div class="cam-dot" aria-hidden="true"></div>
  <div id="statusBar" aria-hidden="true">
    <span id="phoneTime"></span>
    <span class="sb-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="21" height="11" rx="3.5" opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor" stroke="none"/><rect x="23" y="4" width="1.6" height="4" rx=".8" fill="currentColor" stroke="none" opacity=".5"/></svg>
    </span>
  </div>

  <!-- 타이틀 = 잠금화면 -->
  <section class="scr" id="scr-title">
    <div class="lk-date" id="lockDate"></div>
    <div class="lk-clock" id="lockClock"></div>
    <div class="title-duo" id="titleChars"></div>
    <div class="lk-notif glass">
      <div class="lk-icon" aria-hidden="true">🎤</div>
      <div class="lk-main">
        <div class="lk-app"><span id="lockApp"></span><span id="lockNow"></span></div>
        <h1 class="title-logo">런칭! 나의 첫 AI 아이돌</h1>
        <p class="title-sub">통장 87만 원으로 시작한 AI 아이돌 회사. 여섯 가지 권리를 지켜야 한다.</p>
      </div>
    </div>
    <button class="title-btn" id="btnNew">새로 시작</button>
    <button class="title-btn ghost" id="btnContinue">이어서 하기</button>
    <div class="title-links">
      <button class="title-reset" id="btnReset">기록 초기화</button>
      <button class="title-reset" id="btnTheme"></button>
    </div>
  </section>

  <!-- 캐릭터 선택 -->
  <section class="scr" id="scr-select">
    <h2 class="sel-head">함께할 AI 아이돌을 골라 주세요</h2>
    <p class="sel-sub">이야기는 같지만, 무대에 서는 아이돌이 달라집니다</p>
    <div class="sel-row" id="selRow"></div>
  </section>

  <!-- 인트로 -->
  <section class="scr" id="scr-intro">
    <div class="idol-char" id="introChar"></div>
    <div id="introCard" class="glass2"></div>
  </section>

  <!-- 에피소드 = 홈 화면 + 앱 층(메신저·권리 수첩·설정) -->
  <section class="scr" id="scr-ep" data-home="story">
    <!-- 홈 화면: 점수 위젯 → 장식 앱 → 아이돌 → 안내 → 독 -->
    <div id="homeScreen">
      <div class="statbar home-widget glass">
        <div id="epHead"></div>
        <div class="stat-nums">
          <span>💰<i class="st-l">자금</i> <span id="stMoney">50</span></span>
          <span>📈<i class="st-l">인지도</i> <span id="stFame">20</span></span>
          <span class="safety">🛡️<i class="st-l">신뢰</i> <span id="stSafety">70</span></span>
        </div>
        <div id="badgeRow"></div>
        <p class="stat-help" id="statHelp"></p>
      </div>
      <div class="app-grid">
        <button type="button" class="app" id="homeOurlog"><span class="ico ico-ourlog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5a8 8 0 1 0 4 10.5 6.5 6.5 0 0 1-4-10.5z"/><path d="M17.5 3v3M16 4.5h3"/></svg></span><span class="app-name"></span></button>
        <div class="app app-decor" id="appCal" aria-hidden="true"><span class="ico ico-cal"><i id="calDow"></i><b id="calDay"></b></span><span class="app-name"></span></div>
      </div>
      <div class="ep-char-row"><div class="idol-char" id="epChar"></div></div>
      <div id="homeHint" role="status"></div>
      <div class="dock glass">
        <div class="app app-decor" id="dockCall" aria-hidden="true"><span class="ico ico-call"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2z"/></svg></span><span class="app-name"></span></div>
        <button type="button" class="app" id="dockMsg"><span class="ico ico-msg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V16A2.5 2.5 0 0 1 4 13.5z"/></svg></span><span class="bdg" id="msgBadge" aria-hidden="true">1</span><span class="app-name"></span></button>
        <button type="button" class="app" id="dockNotes"><span class="ico ico-notes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3.5" width="13" height="17" rx="2.5"/><path d="M9.5 8h6M9.5 12h6M4 7.5h2M4 12h2M4 16.5h2"/></svg></span><span class="app-name"></span></button>
        <button type="button" class="app" id="dockSettings"><span class="ico ico-set"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></span><span class="app-name"></span></button>
      </div>
    </div>
    <!-- 알림 배너: 스토리가 끝나면 위에서 내려온다 -->
    <button type="button" id="notifBanner" class="glass2">
      <span class="ico ico-msg nb-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V16A2.5 2.5 0 0 1 4 13.5z"/></svg></span>
      <span class="nb-text"><b class="nb-room"></b><span class="nb-preview"></span></span>
      <span class="nb-time"></span>
    </button>
    <!-- 스토리 씬: 홈 화면 위, 독 자리를 덮는 카드. 화면 어디를 눌러도 다음으로 -->
    <div id="storyStage" class="story-stage">
      <div class="story-card glass2">
        <div class="story-emoji" id="storyEmoji"></div>
        <p class="story-text" id="storyText"></p>
        <button type="button" class="tap-hint" id="storyNext">눌러서 계속 (<span id="storyIdx"></span>)</button>
      </div>
    </div>
    <!-- 메신저 앱 -->
    <div id="phoneWrap" class="applayer">
      <div class="app-head"><button type="button" class="app-back" id="msgBack">‹</button><div class="chat-ava" id="chatAva"></div><span id="chatRoom"></span></div>
      <div class="stat-pill">💰 <span class="js-stat" data-k="money"></span> · 📈 <span class="js-stat" data-k="fame"></span> · 🛡️ <span class="js-stat" data-k="safety"></span></div>
      <div id="chatLog"></div>
      <div id="chatChoices"></div>
      <div class="composer" id="composer"><span id="chatTapHint"></span><span class="send" aria-hidden="true">↑</span></div>
    </div>
    <!-- 권리 수첩 앱 -->
    <div id="appNotes" class="applayer">
      <div class="app-head"><button type="button" class="app-back" id="notesBack">‹</button><span class="app-title" id="notesTitle"></span></div>
      <div class="app-body" id="notesList"></div>
    </div>
    <!-- ourlog 앱 -->
    <div id="appOurlog" class="applayer">
      <div class="app-head"><button type="button" class="app-back" id="olBack">‹</button><span class="ol-logo" id="olLogo"></span><span class="ol-live" id="olLive" hidden><i aria-hidden="true"></i><span id="olLiveText"></span></span></div>
      <div class="app-body" id="olBody"></div>
    </div>
    <!-- 설정 앱 -->
    <div id="appSettings" class="applayer">
      <div class="app-head"><button type="button" class="app-back" id="setBack">‹</button><span class="app-title" id="settingsTitle"></span></div>
      <div class="app-body" id="settingsBody"></div>
    </div>
  </section>

  <!-- 법정 / 엔딩 -->
  <section class="scr" id="scr-court"></section>
  <section class="scr" id="scr-end"></section>

  <!-- 산출물 "나의 권리 수첩" — 엔딩·권리 수첩 앱에서 연다. 인쇄하면 이 층의 종이만 나온다 -->
  <section id="productSheet" class="applayer">
    <div class="app-head"><button type="button" class="app-back" id="prodBack">‹</button><span class="app-title" id="prodTitle"></span></div>
    <div class="app-body prod-paper" id="prodPaper"></div>
    <div class="prod-actions">
      <button type="button" class="choice-btn primary" id="btnPrint"></button>
      <button type="button" class="choice-btn" id="btnCopy"></button>
      <div id="prodStatus" role="status"></div>
    </div>
  </section>

  <!-- ourlog 알림 카드: 수첩 적기 뒤·정산 앞(js/ui/ourlog.js offer). #app의 직계 자식 — 떠 있는 동안 다른 자식은 inert -->
  <div id="olNotice" role="dialog" aria-modal="true" aria-labelledby="olNText" aria-describedby="olNCount" hidden>
    <div class="oln-head"><span class="ico ico-ourlog oln-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15.5 4.5a8 8 0 1 0 4 10.5 6.5 6.5 0 0 1-4-10.5z"/><path d="M17.5 3v3M16 4.5h3"/></svg></span><span id="olNTitle"></span></div>
    <p class="oln-text" id="olNText"></p>
    <p class="oln-count" id="olNCount"></p>
    <div class="oln-btns"><button type="button" class="oln-btn" id="olOpen"></button><button type="button" class="oln-btn ghost" id="olSkip"></button></div>
  </div>

  <!-- 팝업 오버레이 -->
  <div id="popup"><div class="pop-card glass2">
    <div class="pop-face"></div>
    <div class="pop-title"></div>
    <div class="pop-body"></div>
    <div class="pop-btns"></div>
  </div></div>

  <div class="home-bar" aria-hidden="true"></div>
</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>

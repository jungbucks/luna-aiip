<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>런칭! 나의 첫 AI 아이돌 — IP를 지켜라</title>
<meta name="description" content="AI 버추얼 아이돌 스타트업 대표가 되어 저작권·특허·상표·영업비밀·초상권·퍼블리시티권 딜레마를 겪는 교육 게임">
<meta name="theme-color" content="#0b0e22">
<!-- 모드 선적용(첫 화면이 반대 색으로 번쩍이지 않게) + 프로브용 오류 수집. 모듈보다 먼저 돈다. -->
<script>(function(){var p;try{p=localStorage.getItem('luna_theme')}catch(e){}
if(p!=='light'&&p!=='dark')p=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=p;
window.__errs=[];addEventListener('error',function(e){__errs.push(e.message)});addEventListener('unhandledrejection',function(e){__errs.push(String(e.reason))});})();</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/phone.css">
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/engine.js">
<link rel="modulepreload" href="js/state.js">
<link rel="modulepreload" href="js/ui/chat.js">
<link rel="modulepreload" href="js/ui/popup.js">
<link rel="modulepreload" href="js/ui/ending.js">
<link rel="modulepreload" href="js/ui/character.js">
<link rel="modulepreload" href="js/ui/theme.js">
<link rel="modulepreload" href="data/episodes.js">
<link rel="modulepreload" href="data/strings.js">
</head>
<body>
<div class="device">
<div id="app" class="screen">

  <!-- 폰 껍데기(기기 틀 모드에서만 보임 — 실제 폰에서는 숨김) -->
  <div class="cam-dot" aria-hidden="true"></div>
  <div id="statusBar" aria-hidden="true">
    <span id="phoneTime"></span>
    <span class="sb-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="21" height="11" rx="3.5" opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor" stroke="none"/><rect x="23" y="4" width="1.6" height="4" rx=".8" fill="currentColor" stroke="none" opacity=".5"/></svg>
    </span>
  </div>

  <!-- 타이틀 = 잠금화면 -->
  <section class="scr" id="scr-title">
    <div class="lk-date" id="lockDate"></div>
    <div class="lk-clock" id="lockClock"></div>
    <div class="title-duo" id="titleChars"></div>
    <div class="lk-notif glass">
      <div class="lk-icon" aria-hidden="true">🎤</div>
      <div class="lk-main">
        <div class="lk-app"><span id="lockApp"></span><span id="lockNow"></span></div>
        <h1 class="title-logo">런칭! 나의 첫 AI 아이돌</h1>
        <p class="title-sub">지식재산권 6종을 지켜라 — 스타트업 생존 스토리</p>
      </div>
    </div>
    <button class="title-btn" id="btnNew">처음부터</button>
    <button class="title-btn ghost glass" id="btnContinue">이어하기</button>
    <button class="title-reset" id="btnReset">기록 초기화</button>
    <button class="round-btn glass" id="btnTheme"></button>
  </section>

  <!-- 캐릭터 선택 -->
  <section class="scr" id="scr-select">
    <h2 class="sel-head">함께할 AI 아이돌을 선택하세요</h2>
    <p class="sel-sub">이야기는 같지만, 무대에 서는 아이돌이 달라집니다</p>
    <div class="sel-row" id="selRow"></div>
  </section>

  <!-- 인트로 -->
  <section class="scr" id="scr-intro">
    <div class="idol-char" id="introChar"></div>
    <div id="introCard" class="glass2"></div>
  </section>

  <!-- 에피소드 -->
  <section class="scr" id="scr-ep">
    <div class="statbar glass">
      <div class="stat-nums">
        <span>💰 <span id="stMoney">50</span></span>
        <span>📈 <span id="stFame">20</span></span>
        <span class="safety">🛡️ <span id="stSafety">70</span></span>
      </div>
      <div id="badgeRow"></div>
    </div>
    <div id="epHead"></div>
    <div class="ep-char-row"><div class="idol-char" id="epChar"></div></div>
    <!-- 스토리 씬 무대: 탭으로 넘기는 내레이션 -->
    <div id="storyStage" class="story-stage">
      <div class="story-card glass2">
        <div class="story-emoji" id="storyEmoji"></div>
        <p class="story-text" id="storyText"></p>
        <div class="tap-hint">눌러서 계속 (<span id="storyIdx"></span>)</div>
      </div>
    </div>
    <!-- 채팅(메신저) -->
    <div id="phoneWrap" class="phone">
      <div class="phone-bar"><span id="chatRoom"></span></div>
      <div id="chatLog"></div>
      <div id="chatTapHint">👆 탭하면 빨리 감기</div>
      <div id="chatChoices"></div>
    </div>
  </section>

  <!-- 법정 / 엔딩 -->
  <section class="scr" id="scr-court"></section>
  <section class="scr" id="scr-end"></section>

  <!-- 팝업 오버레이 -->
  <div id="popup"><div class="pop-card glass2">
    <div class="pop-title"></div>
    <div class="pop-body"></div>
    <div class="pop-btns"></div>
  </div></div>

  <div class="home-bar" aria-hidden="true"></div>
</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<!-- probe.html — E2E 프로브 (CLAUDE.md 검증 §2 절차).
     실행: 이 파일을 루트에 __probe.html로 복사 → Node 정적 서버로 서빙(같은 오리진 필수)
     → msedge --headless=new --user-data-dir=<임시> --virtual-time-budget=20000 --dump-dom http://localhost:PORT/__probe.html
     → <pre id="out">의 PASS/FAIL 수확 → __probe.html 삭제. -->
<meta charset="utf-8">
<pre id="out"></pre>
<iframe id="f" width="480" height="800"></iframe>
<script>
const out = document.getElementById('out');
const log = (name, ok, extra = '') => out.textContent += (ok ? 'PASS ' : 'FAIL ') + name + (extra ? ' — ' + extra : '') + '\n';
const f = document.getElementById('f');
const D = () => f.contentDocument, W = () => f.contentWindow;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 8000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) {} await sleep(50); }
  return false;
}
const active = id => D().getElementById(id).classList.contains('active');
const txt = id => D().getElementById(id).textContent;
const popupShown = () => D().getElementById('popup').classList.contains('show');
const E = id => D().getElementById(id);
const home = () => E('scr-ep').dataset.home;
async function throughStory() {            // 스토리 씬 끝까지 → 알림 대기
  for (let i = 0; i < 8 && home() !== 'notify'; i++) { E('storyStage').click(); await sleep(80); }
  return until(() => home() === 'notify' && E('notifBanner').classList.contains('in'));
}
async function writeNote(text) {           // 적기: 글 상자에 넣고 [수첩에 적기]
  await until(() => E('appNotes').classList.contains('on') && !!E('noteInput'));
  const i = E('noteInput'); i.value = text; i.dispatchEvent(new (W().Event)('input', { bubbles: true }));
  await sleep(50); E('noteSave').click();
}
const noticeUp = () => { const n = E('olNotice'); return !!n && !n.hidden && n.getClientRects().length > 0; };
async function skipOurlog() {              // 수첩 적기 뒤 ourlog 알림 카드 → [넘어가기](정산으로)
  if (await until(noticeUp, 3000)) E('olSkip').click();
}
const WALL = { dark: ['#6d4bd8', '#1aa9cc', '#c0468f', '#0b0e22'], light: ['#ffd3bd', '#bfd0ff', '#d2bcff', '#eef0fb'] };   // css/style.css의 --wall 색들
const parseColor = c => { c = c.trim(); if (c[0] === '#') { const h = c.length === 4 ? c.slice(1).replace(/./g, x => x + x) : c.slice(1); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), 1]; } const m = c.match(/[\d.]+/g).map(Number); return [m[0], m[1], m[2], m.length > 3 ? m[3] : 1]; };
const over = (top, bot) => [0, 1, 2].map(i => top[i] * top[3] + bot[i] * (1 - top[3])).concat(1);
const lum = c => { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function minContrast(theme) {            // 본문(--ink)·흐린 글자(--dim)가 유리(--glass, --glass2) 위에서 갖는 최소 대비
  const cs = W().getComputedStyle(D().documentElement), v = n => parseColor(cs.getPropertyValue(n));
  let min = 99, where = '';
  for (const g of ['--glass', '--glass2']) for (const w of WALL[theme]) {
    const bg = over(v(g), parseColor(w));
    for (const t of ['--ink', '--dim']) { const r = ratio(over(v(t), bg), bg); if (r < min) { min = r; where = t + ' on ' + g + ' over ' + w; } }
  }
  return { min, where };
}
const savedNotes = () => JSON.parse(W().localStorage.getItem('luna_notes_v1') || '{}');

// 보안 검토 2026-11-18 A: 자동화 브라우저 + ?probe=1(run-probe.mjs가 붙임)일 때만 게임을 띄우고 저장을 만진다 — 사람이 이 주소를 열어도 게임 기록을 지우지 않게
const AUTOMATED = navigator.webdriver === true && new URLSearchParams(location.search).get('probe') === '1';
async function run() {
  if (!AUTOMATED) { out.textContent = '자동 검사 전용 페이지입니다. 아무것도 하지 않았습니다.\n'; return; }
  f.src = '/index.html';
  try {
    await until(() => W().LUNA && D().getElementById('btnNew'));
    W().localStorage.removeItem('luna_save_v1'); W().localStorage.removeItem('luna_notes_v1');
    log('부트: 타이틀 활성', active('scr-title'));
    const html = () => D().documentElement;
    log('shell: 폰 껍데기 안에 #app', !!D().querySelector('.device > #app.screen') && !!D().getElementById('statusBar'));
    log('shell: 시계가 실제 시각', /^\d{1,2}:\d{2}$/.test(txt('phoneTime')) && /^\d{1,2}:\d{2}$/.test(txt('lockClock')));
    log('theme: data-theme 항상 설정', ['light', 'dark'].includes(html().dataset.theme));
    const before = html().dataset.theme;
    D().getElementById('btnTheme').click();
    log('theme: 버튼으로 전환 + 저장', html().dataset.theme !== before && W().localStorage.getItem('luna_theme') === html().dataset.theme);
    log('theme: 모드 단추는 글자 단추(바꿀 모드) + 읽어 주기 이름', E('btnTheme').textContent === (html().dataset.theme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드') && /모드로 바꾸기$/.test(E('btnTheme').getAttribute('aria-label')));
    log('theme: 모드 단추가 기록 초기화 옆 — 위쪽에 떠 있지 않음', E('btnTheme').parentElement === E('btnReset').parentElement && W().getComputedStyle(E('btnTheme')).position === 'static');
    log('theme: 주소창 색도 바뀜', D().querySelector('meta[name="theme-color"]').content === (html().dataset.theme === 'dark' ? '#0b0e22' : '#eef0fb'));
    log('font: Pretendard 선언', [...D().fonts].some(ff => ff.family.replace(/["']/g, '') === 'Pretendard'));
    log('no-gradient-text: 제목에 글자 그라데이션 없음', W().getComputedStyle(D().querySelector('.title-logo')).webkitTextFillColor !== 'rgba(0, 0, 0, 0)');
    log('타이틀 듀오 PNG 2개', D().querySelectorAll('#titleChars img.idol-svg').length === 2);

    // 2026-11-18 검토 P1: 타이틀의 [새로 시작]·[기록 초기화]는 기록이 있으면 먼저 묻고, 승인한 뒤에만 지운다
    const popBtn = cls => D().querySelector('#popup .pop-btn.' + cls);
    const hasBoth = () => !!W().localStorage.getItem('luna_save_v1') && !!W().localStorage.getItem('luna_notes_v1');
    const seedSave = () => {
      const g = W().LUNA.engine.newGame(); g.idol = 'sol';
      W().localStorage.setItem('luna_save_v1', JSON.stringify({ schemaVersion: 1, game: g, phase: 'ep' }));
      W().localStorage.setItem('luna_notes_v1', JSON.stringify({ 1: '저작권은 표현을 보호한다' }));
    };
    seedSave();
    for (const id of ['btnNew', 'btnReset']) {
      E(id).click(); await until(popupShown, 3000);
      log('wipe-ask: ' + id + ' — 기록이 있으면 먼저 묻고 아직 지우지 않음', popupShown() && hasBoth() && active('scr-title') && !!popBtn('ghost') && !!popBtn('danger'));
      if (popBtn('ghost')) popBtn('ghost').click();
      await sleep(100);
      log('wipe-ask: ' + id + ' — 그만두면 진행·수첩 그대로 + 누른 단추로 초점', !popupShown() && hasBoth() && active('scr-title') && D().activeElement === E(id));
    }
    E('btnReset').click(); await until(popupShown, 3000);
    if (popBtn('danger')) popBtn('danger').click();
    await sleep(300); await until(() => W().LUNA && E('btnNew') && active('scr-title'));
    log('wipe-ask: btnReset — 승인하면 진행·수첩 둘 다 지움', W().localStorage.getItem('luna_save_v1') === null && W().localStorage.getItem('luna_notes_v1') === null && W().localStorage.getItem('luna_theme') !== null);
    seedSave();
    E('btnNew').click(); await until(popupShown, 3000);
    if (popBtn('danger')) popBtn('danger').click();
    await until(() => active('scr-select'), 3000);
    log('wipe-ask: btnNew — 승인하면 진행·수첩 둘 다 지우고 캐릭터 선택으로', active('scr-select') && W().localStorage.getItem('luna_save_v1') === null && W().localStorage.getItem('luna_notes_v1') === null);

    // 보안 검토 2026-11-18 B: 키 하나가 안 지워지면(removeItem 예외) 남은 기록과 [다시 지우기]를 보여 주고, 새 판·새로 고침은 보류
    const LABEL = { luna_save_v1: '게임 기록', luna_notes_v1: '수첩에 적은 글' };
    for (const [id, stuck] of [['btnReset', 'luna_notes_v1'], ['btnNew', 'luna_save_v1']]) {
      const other = stuck === 'luna_save_v1' ? 'luna_notes_v1' : 'luna_save_v1';
      f.src = '/index.html?wipe=' + id; await sleep(200); await until(() => W().LUNA && E('btnNew') && active('scr-title'));
      seedSave();
      const SP = W().Storage.prototype, orig = SP.removeItem;
      SP.removeItem = function (k) { if (k === stuck) throw new Error('blocked'); return orig.call(this, k); };
      W().__wipeMark = 1;                                     // 새로 고침이 일어나면 사라진다
      const failShown = () => popupShown() && txt('popup').includes('다시 지우기');
      E(id).click(); await until(popupShown, 3000);
      popBtn('danger').click(); await until(failShown, 3000);
      log(`wipe-fail: ${id} — 하나가 안 지워지면 알리고 남은 기록만 보여 줌`, failShown() && txt('popup').includes(LABEL[stuck]) && !txt('popup').includes(LABEL[other]));
      log(`wipe-fail: ${id} — 초기화 성공 처리 보류(타이틀 그대로·새로 고침 없음)`, active('scr-title') && W().__wipeMark === 1 && W().localStorage.getItem(stuck) !== null && W().localStorage.getItem(other) === null);
      if (id === 'btnReset') {                                // 그만두면 남은 기록 그대로, 누른 단추로 초점
        popBtn('ghost').click(); await sleep(100);
        log('wipe-fail: 그만두기 — 팝업 닫히고 초점은 누른 단추로', !popupShown() && active('scr-title') && D().activeElement === E(id) && W().__wipeMark === 1);
        E(id).click(); await until(popupShown, 3000);       // 남은 글이 있으니 다시 묻는다
        popBtn('danger').click(); await until(failShown, 3000);
      }
      SP.removeItem = orig;                                   // 이제는 지워지는 상태
      popBtn('danger').click();                               // [다시 지우기]
      if (id === 'btnReset') { await sleep(300); await until(() => W().LUNA && E('btnNew') && W().__wipeMark !== 1 && active('scr-title')); }
      else await until(() => active('scr-select'), 3000);
      log(`wipe-fail: ${id} — 다시 지우기로 다 지우고 원래 다음 단계로(모드는 남음)`, W().localStorage.getItem('luna_save_v1') === null && W().localStorage.getItem('luna_notes_v1') === null && W().localStorage.getItem('luna_theme') !== null
        && (id === 'btnNew' ? active('scr-select') : W().__wipeMark !== 1 && active('scr-title')));
    }

    D().getElementById('btnNew').click();
    await until(() => active('scr-select'));
    log('캐릭터 선택 화면 + 카드 2개', active('scr-select') && D().querySelectorAll('.sel-card').length === 2);
    log('wipe-ask: 기록 없는 첫 방문은 묻지 않고 바로 시작', active('scr-select') && !popupShown());

    // 2026-11-18 검토 P1: 마우스 없이 Tab·Enter/Space만으로 캐릭터 선택 → EP1 알림까지.
    // 진짜 키 입력은 헤드리스 프로브에서 못 만든다 → 초점이 '이름 있는 <button>'에 오는지 + 키 한 번(keydown + 기본 동작 click + keyup)이 장면 하나만 넘기는지 본다
    const focusedBtnIn = sec => { const a = D().activeElement; return !!a && a.tagName === 'BUTTON' && E(sec).contains(a) && a.offsetParent !== null && (a.getAttribute('aria-label') || a.textContent).trim().length > 0; };
    const press = async () => {
      const a = D().activeElement, K = W().KeyboardEvent;
      a.dispatchEvent(new K('keydown', { key: 'Enter', code: 'Enter', bubbles: true }));
      a.click();
      a.dispatchEvent(new K('keyup', { key: 'Enter', code: 'Enter', bubbles: true }));
      await sleep(80);
    };
    log('kbd: 선택 화면에 들어오면 카드에 초점', focusedBtnIn('scr-select'));
    D().querySelector('.sel-card[data-idol="sol"]').focus();
    await press();
    await until(() => active('scr-intro'));
    log('솔 선택: 인트로 이름 치환', txt('introCard').includes('솔(SOL)'));
    log('kbd: 캐릭터를 고르면 인트로의 [다음] 단추에 초점', focusedBtnIn('scr-intro'), D().activeElement && D().activeElement.outerHTML.slice(0, 60));
    const introN = () => (txt('introCard').match(/\((\d)\/4\)/) || [])[1];
    for (let i = 1; i <= 3; i++) {
      await press();
      log('kbd: 인트로 키 한 번 = 한 장면(' + i + '→' + (i + 1) + ') + 초점 유지', introN() === String(i + 1) && focusedBtnIn('scr-intro'), 'now ' + introN());
    }
    await press();
    await until(() => active('scr-ep'));
    log('EP1 진입', active('scr-ep'));
    log('stat: 점수 이름표(자금·인지도·신뢰) + EP1에만 뜻 설명', [...D().querySelectorAll('.stat-nums .st-l')].map(x => x.textContent).join() === '자금,인지도,신뢰' && txt('statHelp').includes('87만 원') && E('statHelp').offsetParent !== null);

    // v0.4 스토리 씬: 무대가 먼저 뜨고, 탭으로 넘기면 폰이 슬라이드업
    log('스토리 씬 무대 표시', D().getElementById('storyStage').classList.contains('on'));
    log('씬 텍스트 토큰 치환', txt('storyText').includes('솔') || !txt('storyText').includes('{n'));
    log('home: 스토리 동안 홈이 깔려 있고 앱은 안 눌림', home() === 'story' && !!E('homeScreen') && (E('dockNotes').click(), !E('appNotes').classList.contains('on')));
    log('ourlog-icon: 홈에 ourlog 단추(장식 아님), 스토리 중엔 안 열림', E('homeOurlog').tagName === 'BUTTON' && (E('homeOurlog').click(), !E('appOurlog').classList.contains('on')));
    log('kbd: 스토리 장면의 [다음] 단추에 초점', focusedBtnIn('storyStage'), D().activeElement && D().activeElement.outerHTML.slice(0, 60));
    log('a11y: 내레이션 단추 이름에 진행 수 (1/n)', /^눌러서 계속 \(1\/\d\)$/.test(E('storyNext').getAttribute('aria-label') || ''), E('storyNext').getAttribute('aria-label'));
    { const bg = W().getComputedStyle(D().querySelector('.story-card')).backgroundColor;   // --solid(다크 0.94)만으로는 뒤 위젯이 비쳤다 — 불투명한 앱 바탕 위에 얹는다(#olNotice와 같은 규칙)
      log('opaque: 내레이션 카드 바탕은 완전 불투명(--solid를 불투명 바탕 위에)', parseColor(bg)[3] === 1, bg); }
    for (let guard = 0; guard < 8 && home() !== 'notify'; guard++) {
      const before = txt('storyIdx');
      await press();
      if (home() !== 'notify') log('kbd: 스토리 키 한 번 = 한 장면(' + before + '→' + txt('storyIdx') + ') + 초점 유지', +txt('storyIdx').split('/')[0] === +before.split('/')[0] + 1 && focusedBtnIn('storyStage'));
    }
    await until(() => home() === 'notify' && E('notifBanner').classList.contains('in'));
    log('kbd: 스토리가 끝나면 EP1 알림에 초점(Enter로 열 수 있음)', D().activeElement === E('notifBanner') && E('notifBanner').tagName === 'BUTTON');
    { const bg = W().getComputedStyle(E('notifBanner')).backgroundColor;
      log('opaque: 알림 배너 바탕은 완전 불투명(--solid를 불투명 바탕 위에)', parseColor(bg)[3] === 1, bg); }
    await throughStory();
    const FIRST = (await import('/data/episodes.js')).EPISODES[0].messages[0];   // EP1 첫 메시지(이름 토큰 없음) — 글자를 박아 두지 않고 데이터에서 읽는다
    log('notify: 알림 대기 — 메신저는 아직 닫힘', home() === 'notify' && !E('phoneWrap').classList.contains('on'));
    log('notify: 미리보기 = 첫 메시지, 이름 토큰 풀림', E('notifBanner').textContent.includes('솔 프로젝트') && E('notifBanner').textContent.includes(FIRST.who + ': ' + FIRST.text) && !/\{[nN]/.test(E('notifBanner').textContent));
    log('notify: 메신저 아이콘에 숫자', E('msgBadge').offsetParent !== null);
    for (const id of ['appCal', 'dockCall']) E(id).click();
    log('decor: 장식 앱 2개는 아무 층도 열지 않음 + 단추가 아닌 aria-hidden div', !D().querySelector('.applayer.on') && ['appCal', 'dockCall'].every(id => E(id).tagName === 'DIV' && E(id).getAttribute('aria-hidden') === 'true' && W().getComputedStyle(E(id)).cursor === 'default'));
    {
      const OL = (await import('/data/strings.js')).STRINGS.ui.ourlog;
      log('ourlog-feed: 선택 전엔 빈 피드 문구', (E('homeOurlog').click(), E('appOurlog').classList.contains('on')) && E('olBody').textContent.includes(OL.empty), E('olBody').textContent.slice(0, 40));
      E('olBack').click();
      log('ourlog-back: ‹로 닫으면 홈, 초점은 ourlog 아이콘', !E('appOurlog').classList.contains('on') && D().activeElement === E('homeOurlog'));
    }
    log('decor: 달력에 오늘 날짜', E('calDay').textContent === String(new Date().getDate()));
    E('dockNotes').click();
    await until(() => E('appNotes').classList.contains('on'));
    const cards = () => [...D().querySelectorAll('#notesList .note-card')];
    log('notes: 6칸, EP1 선택 전에는 모두 잠김', cards().length === 6 && cards().every(c => c.dataset.state === 'locked') && cards()[2].textContent.includes('EP3에서 만나요'));
    log('notes: 진행 중인 EP의 개념 힌트는 안 보임', !E('appNotes').textContent.includes('표현'));
    E('notesBack').click(); await until(() => !E('appNotes').classList.contains('on'));
    E('dockSettings').click();
    await until(() => E('appSettings').classList.contains('on'));
    D().querySelector('[data-theme-pref="light"]').click();
    log('settings: 라이트 고르기', D().documentElement.dataset.theme === 'light' && D().querySelector('[data-theme-pref="light"]').getAttribute('aria-pressed') === 'true');
    D().querySelector('[data-theme-pref="system"]').click();
    log('settings: 기기 설정 따름 = 저장 지움', W().localStorage.getItem('luna_theme') === null);
    D().querySelector('[data-theme-pref="dark"]').click();
    E('setReset').click(); await until(popupShown);
    log('settings: 초기화는 한 번 더 물음', txt('popup').includes('지울까요') && D().querySelectorAll('#popup .pop-btn').length === 2);
    [...D().querySelectorAll('#popup .pop-btn')].find(b => b.textContent.includes('그만두기')).click();
    log('settings: 그만두면 그대로', !!W().localStorage.getItem('luna_save_v1') && E('appSettings').classList.contains('on'));
    E('setBack').click(); await until(() => !E('appSettings').classList.contains('on'));
    E('notifBanner').click(); E('notifBanner').click(); E('dockMsg').click();     // notify-double: 연타
    await until(() => E('phoneWrap').classList.contains('on'));
    log('폰 프레임 등장', E('phoneWrap').classList.contains('on'));
    await sleep(900);
    log('notify-double: 연타해도 첫 메시지는 하나', [...D().querySelectorAll('#chatLog .msg')].filter(m => m.textContent.includes(FIRST.text)).length === 1);
    E('msgBack').click();
    await until(() => !E('phoneWrap').classList.contains('on'));
    const kept = D().querySelectorAll('#chatLog .msg').length;
    log('back: ‹ 로 홈 — 숫자 다시 붙고 대화는 남음', E('msgBadge').offsetParent !== null && kept > 0);

<!DOCTYPE html>
<!-- probe.html — E2E 프로브 (CLAUDE.md 검증 §2 절차).
     실행: 이 파일을 루트에 __probe.html로 복사 → Node 정적 서버로 서빙(같은 오리진 필수)
     → msedge --headless=new --user-data-dir=<임시> --virtual-time-budget=20000 --dump-dom http://localhost:PORT/__probe.html
     → <pre id="out">의 PASS/FAIL 수확 → __probe.html 삭제. -->
<meta charset="utf-8">
<pre id="out"></pre>
<iframe id="f" src="/index.html" width="480" height="800"></iframe>
<script>
const out = document.getElementById('out');
const log = (name, ok, extra = '') => out.textContent += (ok ? 'PASS ' : 'FAIL ') + name + (extra ? ' — ' + extra : '') + '\n';
const f = document.getElementById('f');
const D = () => f.contentDocument, W = () => f.contentWindow;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 8000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) {} await sleep(50); }
  return false;
}
const active = id => D().getElementById(id).classList.contains('active');
const txt = id => D().getElementById(id).textContent;
const popupShown = () => D().getElementById('popup').classList.contains('show');

async function run() {
  try {
    await until(() => W().LUNA && D().getElementById('btnNew'));
    W().localStorage.removeItem('luna_save_v1');
    log('부트: 타이틀 활성', active('scr-title'));
    const html = () => D().documentElement;
    log('shell: 폰 껍데기 안에 #app', !!D().querySelector('.device > #app.screen') && !!D().getElementById('statusBar'));
    log('shell: 시계가 실제 시각', /^\d{1,2}:\d{2}$/.test(txt('phoneTime')) && /^\d{1,2}:\d{2}$/.test(txt('lockClock')));
    log('theme: data-theme 항상 설정', ['light', 'dark'].includes(html().dataset.theme));
    const before = html().dataset.theme;
    D().getElementById('btnTheme').click();
    log('theme: 버튼으로 전환 + 저장', html().dataset.theme !== before && W().localStorage.getItem('luna_theme') === html().dataset.theme);
    log('theme: 주소창 색도 바뀜', D().querySelector('meta[name="theme-color"]').content === (html().dataset.theme === 'dark' ? '#0b0e22' : '#eef0fb'));
    log('font: Pretendard 선언', [...D().fonts].some(ff => ff.family.replace(/["']/g, '') === 'Pretendard'));
    log('no-gradient-text: 제목에 글자 그라데이션 없음', W().getComputedStyle(D().querySelector('.title-logo')).webkitTextFillColor !== 'rgba(0, 0, 0, 0)');
    log('타이틀 듀오 PNG 2개', D().querySelectorAll('#titleChars img.idol-svg').length === 2);

    D().getElementById('btnNew').click();
    await until(() => active('scr-select'));
    log('캐릭터 선택 화면 + 카드 2개', active('scr-select') && D().querySelectorAll('.sel-card').length === 2);

    D().querySelector('.sel-card[data-idol="sol"]').click();
    await until(() => active('scr-intro'));
    log('솔 선택: 인트로 이름 치환', txt('introCard').includes('솔(SOL)'));
    for (let i = 0; i < 4; i++) { D().getElementById('introCard').click(); await sleep(80); }
    await until(() => active('scr-ep'));
    log('EP1 진입', active('scr-ep'));

    // v0.4 스토리 씬: 무대가 먼저 뜨고, 탭으로 넘기면 폰이 슬라이드업
    log('스토리 씬 무대 표시', D().getElementById('storyStage').classList.contains('on'));
    log('씬 텍스트 토큰 치환', txt('storyText').includes('솔') || !txt('storyText').includes('{n'));
    for (let i = 0; i < 6 && !D().getElementById('phoneWrap').classList.contains('on'); i++) {
      D().getElementById('storyStage').click(); await sleep(80);
    }
    log('폰 프레임 등장', D().getElementById('phoneWrap').classList.contains('on'));
    log('단톡방 이름 치환(솔 프로젝트)', txt('chatRoom').includes('솔 프로젝트'));

    // v0.4 자동 재생: 클릭 없이도 메시지가 흐르는지 먼저 확인 → 이후 탭으로 빨리 감기
    const n0 = D().querySelectorAll('#chatLog .msg:not(.typing)').length;
    await sleep(2600);
    log('채팅 자동 재생(무클릭 진행)', D().querySelectorAll('#chatLog .msg:not(.typing)').length > n0);
    for (let i = 0; i < 40 && !D().querySelector('#chatChoices .choice-btn'); i++) { D().getElementById('chatLog').click(); await sleep(70); }
    await until(() => D().querySelector('#chatChoices .choice-btn'));
    log('빨리 감기로 완주', true);
    log('조사 자동 치환(솔이 직접 작곡함)', txt('chatLog').includes('솔이 직접 작곡함'));
    log('화면에 토큰 잔여 없음', !/\{[nN]/.test(D().body.textContent));

    D().querySelectorAll('#chatChoices .choice-btn')[1].click();   // B 정답
    await until(popupShown);
    log('정답 팝업(배지 획득)', D().querySelector('.pop-title').textContent.includes('배지 획득'));
    log('상태 idol=sol', W().LUNA.state.idol === 'sol');

    // 2026-11-14 O/X 확인 퀴즈: 정답 [계속] → 퀴즈 → (틀리면 하나 더) → 정산. 문항 원본은 data/quiz.js(EP1 본 문제 답 X, 하나 더 답 X)
    const ptitle = () => D().querySelector('.pop-title').textContent;
    const pbtns = () => [...D().querySelectorAll('#popup .pop-btn')];
    const clickWhenReady = async (pick) => { await until(() => pbtns().length && !pick().disabled); pick().click(); };
    D().querySelector('.pop-btn').click();                          // 계속 → 퀴즈
    await until(() => popupShown() && ptitle().includes('개념 확인 O/X'));
    log('quiz-after-right: 정답 뒤 퀴즈(문장·버튼 2개)', ptitle().includes('개념 확인 O/X') && txt('popup').includes('출처만 밝히면') && pbtns().length === 2);
    // 최종 검토(2026-11-14): 팝업이 떠 있는 동안 뒤 화면(선택지)에 Tab·클릭이 닿지 않음 + 버튼이 풀리면 첫 버튼에 초점
    log('popup-inert: 팝업 동안 뒤 화면 선택지가 inert', !!D().querySelector('#chatChoices .choice-btn') && !!D().querySelector('#chatChoices .choice-btn').closest('[inert]') && !D().getElementById('popup').closest('[inert]'));
    await until(() => !pbtns()[0].disabled);
    log('popup-focus: 잠금이 풀리면 첫 버튼에 초점', D().activeElement === pbtns()[0]);
    await clickWhenReady(() => pbtns()[0]);                        // ⭕ (틀림)
    await until(() => popupShown() && ptitle().includes('아쉬워요'));
    log('quiz-wrong-more: 오답 → 아쉬워요·정답 X·해설·하나 더 버튼', ptitle().includes('아쉬워요') && txt('popup').includes('정답: X') && txt('popup').includes('허락을 대신하지') && pbtns().length === 1 && pbtns()[0].textContent.includes('하나 더'));
    // quiz-no-double: 하나 더 버튼을 빠르게 두 번 — 둘째 문제의 ⭕가 눌리지 않아야 한다
    await clickWhenReady(() => pbtns()[0]); D().querySelector('#popup .pop-btn') && D().querySelector('#popup .pop-btn').click();
    await sleep(120);
    log('quiz-no-double: 연타해도 둘째 문제가 열린 채 대기', popupShown() && ptitle().includes('개념 확인 O/X') && txt('popup').includes('등록한 작품에만'));
    await clickWhenReady(() => pbtns()[1]);                        // ❌ (맞음)
    await until(() => popupShown() && ptitle().includes('맞았어요'));
    log('quiz-wrong-more: 둘째 문제 맞음 → 맞았어요', ptitle().includes('맞았어요') && txt('popup').includes('정답: X'));
    await clickWhenReady(() => pbtns()[0]);                        // 계속 → 브릿지
    await until(() => popupShown() && ptitle().includes('정산'));
    log('quiz-wrong-more: 퀴즈 기록 more-ok · 스탯 그대로', W().LUNA.state.quiz && W().LUNA.state.quiz[1] === 'more-ok');
    log('브릿지 정산 이름 치환(솔 활동)', D().querySelector('.pop-title').textContent.includes('솔 활동'));
    D().querySelector('.pop-btn').click();                          // EP2 시작
    await until(() => txt('epHead').includes('EP2'));
    log('EP2 진입', txt('epHead').includes('EP2'));
    log('popup-inert: 팝업이 닫히면 inert 해제', !D().querySelector('#app [inert]'));
    const save = JSON.parse(W().localStorage.getItem('luna_save_v1'));
    log('저장에 idol=sol', save && save.game.idol === 'sol');

    // 이어하기 복원
    f.src = '/index.html?r=1';
    await sleep(200);
    await until(() => W().LUNA && D().getElementById('btnContinue') && D().getElementById('btnContinue').style.display !== 'none');
    log('theme: 새로 고쳐도 유지', D().documentElement.dataset.theme === W().localStorage.getItem('luna_theme'));
    D().getElementById('btnContinue').click();
    await until(() => active('scr-ep'));
    const epImg = D().querySelector('#epChar img.idol-svg');
    log('이어하기: 솔 캐릭터+EP2 복원', !!epImg && epImg.dataset.idol === 'sol' && txt('epHead').includes('EP2'));

    // 루나 경로
    W().localStorage.removeItem('luna_save_v1');
    f.src = '/index.html?r=2';
    await sleep(200);
    await until(() => W().LUNA && D().getElementById('btnNew'));
    D().getElementById('btnNew').click();
    await until(() => active('scr-select'));
    D().querySelector('.sel-card[data-idol="luna"]').click();
    await until(() => active('scr-intro'));
    log('루나 선택: 인트로 이름 치환', txt('introCard').includes('루나(LUNA)'));
    const lunaImg = D().querySelector('#epChar img.idol-svg');
    log('루나 캐릭터 PNG 장착', !!lunaImg && lunaImg.dataset.idol === 'luna');

    // quiz-after-accept(실제 플레이): 루나로 EP1 오답 → [대가를 치르고 진행] → 퀴즈 → 정산
    for (let i = 0; i < 4; i++) { D().getElementById('introCard').click(); await sleep(80); }
    await until(() => active('scr-ep'));
    for (let i = 0; i < 6 && !D().getElementById('phoneWrap').classList.contains('on'); i++) { D().getElementById('storyStage').click(); await sleep(80); }
    for (let i = 0; i < 40 && !D().querySelector('#chatChoices .choice-btn'); i++) { D().getElementById('chatLog').click(); await sleep(70); }
    await until(() => D().querySelector('#chatChoices .choice-btn'));
    D().querySelectorAll('#chatChoices .choice-btn')[0].click();   // A 오답
    await until(() => popupShown() && pbtns().some(b => b.textContent.includes('대가를 치르고')));
    pbtns().find(b => b.textContent.includes('대가를 치르고')).click();
    await until(() => popupShown() && (ptitle().includes('개념 확인 O/X') || ptitle().includes('정산')) || active('scr-court'));
    if (active('scr-court')) { D().getElementById('courtBtn').click(); await until(() => popupShown() && ptitle().includes('개념 확인 O/X')); }
    log('quiz-after-accept: 오답 진행 뒤에도 정산 전에 퀴즈', popupShown() && ptitle().includes('개념 확인 O/X'));
    await clickWhenReady(() => pbtns()[1]);                        // ❌ (맞음)
    await until(() => popupShown() && ptitle().includes('맞았어요'));
    await clickWhenReady(() => pbtns()[0]);
    await until(() => popupShown() && ptitle().includes('정산'));
    log('quiz-after-accept: 맞음 → 정산, 기록 ok', ptitle().includes('정산') && W().LUNA.state.quiz && W().LUNA.state.quiz[1] === 'ok');
    // 정산 팝업에서 새로 고침 → 이어 하기: EP1 시작 점수에서 다시(오답 벌점이 두 번 들어가지 않음, 2026-11-14)
    const startStats = JSON.stringify(W().LUNA.engine.newGame().stats);
    f.src = '/index.html?r=3';
    await sleep(200);
    await until(() => W().LUNA && D().getElementById('btnContinue') && D().getElementById('btnContinue').style.display !== 'none');
    D().getElementById('btnContinue').click();
    await until(() => active('scr-ep'));
    log('resume-from-ep-start: 새로 고침 뒤 EP1 시작 점수·오답 기록 없음·루나', JSON.stringify(W().LUNA.state.stats) === startStats && W().LUNA.state.ep === 1 && W().LUNA.state.wrongs.length === 0 && W().LUNA.state.idol === 'luna', JSON.stringify(W().LUNA.state.stats));

    // 엔딩 '다시 볼 개념'(상태 주입 — 실제 플레이 아님): 선택은 다 맞혔고 퀴즈만 EP2를 놓친 경우 / 퀴즈도 다 맞힌 경우
    const st = W().LUNA.state;
    st.wrongs = []; st.quiz = { 1: 'ok', 2: 'missed' };
    W().LUNA.showEnding('unicorn');
    await until(() => active('scr-end'));
    const endTxt = () => txt('scr-end');
    log('ending-clean-vs-quiz(주입): 놓친 EP2의 개념 요약이 보이고 "틀린 개념이 없습니다"는 없음', endTxt().includes('두 번 다 놓친 개념') && endTxt().includes('출원 전에 스스로 공개') && !endTxt().includes('틀린 개념이 없습니다'));
    st.quiz = { 1: 'ok', 2: 'more-ok' };
    W().LUNA.showEnding('unicorn');
    await sleep(100);
    log('ending-clean-vs-quiz(주입): 다 맞힌 경우 기존 문구만', endTxt().includes('틀린 개념이 없습니다') && !endTxt().includes('두 번 다 놓친 개념'));
  } catch (e) { log('예외 발생', false, e.message); }
  out.textContent += 'PROBE-DONE\n';
  document.title = 'PROBE-DONE';
}
run();
</script>

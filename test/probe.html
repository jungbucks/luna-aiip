const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 8000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) {} await sleep(50); }
  return false;
}

}
async function writeNote(text) {           // 적기: 글 상자에 넣고 [수첩에 적기]

}
const WALL = { dark: ['#6d4bd8', '#1aa9cc', '#c0468f', '#0b0e22'], light: ['#ffd3bd', '#bfd0ff', '#d2bcff', '#eef0fb'] };   // css/style.css의 --wall 색들
const parseColor = c => { c = c.trim(); if (c[0] === '#') { const h = c.length === 4 ? c.slice(1).replace(/./g, x => x + x) : c.slice(1); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), 1]; } const m = c.match(/[\d.]+/g).map(Number); return [m[0], m[1], m[2], m.length > 3 ? m[3] : 1]; };
const over = (top, bot) => [0, 1, 2].map(i => top[i] * top[3] + bot[i] * (1 - top[3])).concat(1);
const lum = c => { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function minContrast(theme) {            // 본문(--ink)·흐린 글자(--dim)가 유리(--glass, --glass2) 위에서 갖는 최소 대비
  const cs = W().getComputedStyle(D().documentElement), v = n => parseColor(cs.getPropertyValue(n));
  let min = 99, where = '';
  for (const g of ['--glass', '--glass2']) for (const w of WALL[theme]) {
    const bg = over(v(g), parseColor(w));
    for (const t of ['--ink', '--dim']) { const r = ratio(over(v(t), bg), bg); if (r < min) { min = r; where = t + ' on ' + g + ' over ' + w; } }
  }
  return { min, where };
}

    log('note: 적으면 수첩이 닫히고 정산 — 글은 별도 키에', !E('appNotes').classList.contains('on') && savedNotes()[1].startsWith('<b>x</b>&') && !W().localStorage.getItem('luna_save_v1').includes('학습용이어도'));
    log('quiz-wrong-more: 퀴즈 기록 more-ok · 스탯 그대로', W().LUNA.state.quiz && W().LUNA.state.quiz[1] === 'more-ok');
    log('브릿지 정산 이름 치환(솔 활동)', D().querySelector('.pop-title').textContent.includes('솔 활동'));
    D().querySelector('.pop-btn').click();                          // EP2 시작
    await until(() => txt('epHead').includes('EP2'));
    log('EP2 진입', txt('epHead').includes('EP2'));
    log('ep-next: 다음 EP는 메신저가 닫힌 홈에서 스토리로', !E('phoneWrap').classList.contains('on') && home() === 'story');
    log('popup-inert: 팝업이 닫히면 inert 해제', !D().querySelector('#app > [inert]'));
    await throughStory();
    E('dockNotes').click(); await until(() => E('appNotes').classList.contains('on'));
    log('notes: EP1을 마치면 1칸 열림 + 배지 문구는 엔딩과 같은 말', cards()[0].dataset.state === 'open' && cards()[0].textContent.includes('저작권') && cards()[0].textContent.includes('완전') && cards()[0].textContent.includes('표현') && cards()[1].dataset.state === 'locked');
    log('note: 수첩 카드에 내 글이 글자 그대로(태그로 안 풀림)', cards()[0].querySelector('.note-mine').textContent.includes('<b>x</b>&') && !cards()[0].querySelector('.note-mine b'));
    cards()[0].querySelector('.note-edit').click(); await until(() => !!E('noteInput'));
    log('note: 고치기 — 전에 쓴 글이 들어 있고 뒤로 갈 수 있음', E('noteInput').value.startsWith('<b>x</b>&') && E('notesBack').offsetParent !== null);
    await writeNote('저작권은 표현을 보호한다');
    await until(() => !E('noteInput'));
    log('note: 고친 글로 바뀜', cards()[0].querySelector('.note-mine').textContent.includes('저작권은 표현을 보호한다'));
    E('notesBack').click(); await until(() => !E('appNotes').classList.contains('on'));
    E('dockSettings').click(); await until(() => E('appSettings').classList.contains('on'));
    let noteDone = 0; W().LUNA.notebook.askNote(2, () => { noteDone++; });
    await until(() => E('appNotes').classList.contains('on') && !!E('noteInput'));
    const topLayer = () => { const a = E('app').getBoundingClientRect(); const el = D().elementFromPoint(a.left + a.width / 2, a.top + a.height / 2); return el && el.closest('.applayer') ? el.closest('.applayer').id : ''; };
    log('layer-order: 나중에 연 수첩이 설정 위에 보임', topLayer() === 'appNotes', topLayer());
    log('note-must: 필수 적기 중에는 다른 카드의 [고치기]·산출물 버튼이 없음', D().querySelectorAll('#notesList .note-edit').length === 0 && !E('notesProduct'));
    await writeNote('특허는 공개하기 전에 먼저 출원');
    await until(() => noteDone === 1);
    log('note-must: 적으면 잠금이 풀리고 다음으로 한 번만 넘어감', noteDone === 1 && !E('appNotes').classList.contains('on') && !E('app').hasAttribute('data-locked'));
    E('setBack').click(); await until(() => !E('appSettings').classList.contains('on'));
    E('dockNotes').click(); await until(() => E('appNotes').classList.contains('on'));
    E('notesBack').click(); await until(() => !E('appNotes').classList.contains('on'));
    const save = JSON.parse(W().localStorage.getItem('luna_save_v1'));
    log('저장에 idol=sol', save && save.game.idol === 'sol');
    log('콘솔 오류 0(솔 경로 EP1 완주까지)', (W().__errs || []).length === 0, (W().__errs || []).join(' | '));

    // 이어하기 복원
    W().location.reload();                 // 주소 이동이 아니라 새로 고침 — 방문 기록의 "앱 열림" 칸이 그대로 남는 경우
    await sleep(200);
    await until(() => W().LUNA && D().getElementById('btnContinue') && D().getElementById('btnContinue').style.display !== 'none');
    log('theme: 새로 고쳐도 유지', D().documentElement.dataset.theme === W().localStorage.getItem('luna_theme'));
    D().getElementById('btnContinue').click();
    await until(() => active('scr-ep'));
    const epImg = D().querySelector('#epChar img.idol-svg');
    log('이어하기: 솔 캐릭터+EP2 복원', !!epImg && epImg.dataset.idol === 'sol' && txt('epHead').includes('EP2'));
    log('note: 새로 고쳐도 글이 남음', savedNotes()[1] === '저작권은 표현을 보호한다');
    await throughStory();
    const hl = W().history.length;
    E('dockNotes').click(); await until(() => E('appNotes').classList.contains('on'));
    log('history: 새로 고침 뒤 앱을 열어도 방문 기록이 쌓이지 않음', W().history.length === hl, hl + '→' + W().history.length);
    E('notesBack').click(); await until(() => !E('appNotes').classList.contains('on'));

    // 루나 경로
    W().localStorage.removeItem('luna_save_v1'); W().localStorage.removeItem('luna_notes_v1');
    f.src = '/index.html?r=2';
    await sleep(200);
    await until(() => W().LUNA && D().getElementById('btnNew'));
    D().getElementById('btnNew').click();
    await until(() => active('scr-select'));
    D().querySelector('.sel-card[data-idol="luna"]').click();
    await until(() => active('scr-intro'));
    log('루나 선택: 인트로 이름 치환', txt('introCard').includes('루나(LUNA)'));
    const lunaImg = D().querySelector('#epChar img.idol-svg');
    log('루나 캐릭터 PNG 장착', !!lunaImg && lunaImg.dataset.idol === 'luna');

    // quiz-after-accept(실제 플레이): 루나로 EP1 오답 → [대가를 치르고 진행] → 퀴즈 → 정산
    for (let i = 0; i < 4; i++) { D().getElementById('introCard').click(); await sleep(80); }
    await until(() => active('scr-ep'));
    await throughStory(); E('notifBanner').click();
    await until(() => E('phoneWrap').classList.contains('on'));
    for (let i = 0; i < 40 && !D().querySelector('#chatChoices .choice-btn'); i++) { D().getElementById('chatLog').click(); await sleep(70); }
    await until(() => D().querySelector('#chatChoices .choice-btn'));
    D().querySelectorAll('#chatChoices .choice-btn')[0].click();   // A 오답
    await until(() => popupShown() && pbtns().some(b => b.textContent.includes('대가를 치르고')));
    pbtns().find(b => b.textContent.includes('대가를 치르고')).click();
    await until(() => popupShown() && (ptitle().includes('개념 확인 O/X') || ptitle().includes('정산')) || active('scr-court'));
    if (active('scr-court')) { D().getElementById('courtBtn').click(); await until(() => popupShown() && ptitle().includes('개념 확인 O/X')); }
    log('quiz-after-accept: 오답 진행 뒤에도 정산 전에 퀴즈', popupShown() && ptitle().includes('개념 확인 O/X'));
    await clickWhenReady(() => pbtns()[1]);                        // ❌ (맞음)
    await until(() => popupShown() && ptitle().includes('맞았어요'));
    await clickWhenReady(() => pbtns()[0]);
    await writeNote('테스트용으로 다섯 자 넘게');
    await until(() => popupShown() && ptitle().includes('정산'));
    log('quiz-after-accept: 맞음 → 정산, 기록 ok', ptitle().includes('정산') && W().LUNA.state.quiz && W().LUNA.state.quiz[1] === 'ok');
    // 정산 팝업에서 새로 고침 → 이어 하기: EP1 시작 점수에서 다시(오답 벌점이 두 번 들어가지 않음, 2026-11-14)
    const startStats = JSON.stringify(W().LUNA.engine.newGame().stats);
    f.src = '/index.html?r=3';
    await sleep(200);
    await until(() => W().LUNA && D().getElementById('btnContinue') && D().getElementById('btnContinue').style.display !== 'none');
    D().getElementById('btnContinue').click();
    await until(() => active('scr-ep'));
    log('resume-from-ep-start: 새로 고침 뒤 EP1 시작 점수·오답 기록 없음·루나', JSON.stringify(W().LUNA.state.stats) === startStats && W().LUNA.state.ep === 1 && W().LUNA.state.wrongs.length === 0 && W().LUNA.state.idol === 'luna', JSON.stringify(W().LUNA.state.stats));
    log('note: 이어 하기 뒤에도 EP1 글은 남아 있음', savedNotes()[1] === '테스트용으로 다섯 자 넘게');

    // 엔딩 '다시 볼 개념'(상태 주입 — 실제 플레이 아님): 선택은 다 맞혔고 퀴즈만 EP2를 놓친 경우 / 퀴즈도 다 맞힌 경우
    const st = W().LUNA.state;
    st.wrongs = []; st.quiz = { 1: 'ok', 2: 'missed' };
    W().LUNA.showEnding('unicorn');
    await until(() => active('scr-end'));
    const endTxt = () => txt('scr-end');
    log('ending-clean-vs-quiz(주입): 놓친 EP2의 개념 요약이 보이고 "틀린 개념이 없습니다"는 없음', endTxt().includes('두 번 다 놓친 개념') && endTxt().includes('출원 전에 스스로 공개') && !endTxt().includes('틀린 개념이 없습니다'));
    st.quiz = { 1: 'ok', 2: 'more-ok' };
    W().LUNA.showEnding('unicorn');
    await sleep(100);
    log('ending-clean-vs-quiz(주입): 다 맞힌 경우 기존 문구만', endTxt().includes('틀린 개념이 없습니다') && !endTxt().includes('두 번 다 놓친 개념'));
    // 산출물 "나의 권리 수첩"
    E('endProduct').click(); await until(() => E('productSheet').classList.contains('on'));
    log('product-modal: 산출물이 떠 있는 동안 뒤 화면은 inert', E('scr-end').hasAttribute('inert') && !E('productSheet').hasAttribute('inert'));
    log('product: 6칸 + 내 글 + 못 간 EP는 빈칸', D().querySelectorAll('.prod-note').length === 6 && D().querySelector('.prod-note[data-ep="1"]').textContent.includes('테스트용으로') && D().querySelector('.prod-note[data-ep="4"]').textContent.includes('(아직 적지 않음)'));
    log('product: 아직 안 간 EP의 개념 힌트는 산출물에도 안 보임', D().querySelector('.prod-note[data-ep="4"]').textContent.includes('EP4에서 만나요') && !D().querySelector('.prod-note[data-ep="4"] .prod-badge').textContent.includes('미획득'));
    E('prodName').value = '10101 테스트';
    log('product: 이름 칸은 저장 안 함', !Object.values(W().localStorage).join('').includes('10101 테스트'));
    let copied = ''; W().navigator.clipboard.writeText = t => { copied = t; return Promise.resolve(); };
    E('btnCopy').click(); await until(() => txt('prodStatus').includes('복사했어요'));
    log('product: 글 복사에 권리 이름·내 글·이름', copied.includes('저작권') && copied.includes('테스트용으로') && copied.includes('10101 테스트') && !copied.includes('미획득'), copied.slice(0, 60).replace(/\n/g, ' / '));
    let printed = 0; W().print = () => { printed++; }; E('btnPrint').click();
    log('product: 인쇄 호출', printed === 1);
    E('prodBack').click(); await until(() => !E('productSheet').classList.contains('on'));
    log('product-modal: 닫으면 잠금이 풀리고 누른 버튼으로 초점', !E('scr-end').hasAttribute('inert') && D().activeElement === E('endProduct'));
    E('endRestart').click(); await until(popupShown);
    log('restart: 다시 하기 전에 한 번 물음', txt('popup').includes('산출물을 먼저 저장'));
    [...D().querySelectorAll('#popup .pop-btn')].find(b => b.textContent.includes('돌아가기')).click();
    log('restart: 돌아가면 글이 남음', !!W().localStorage.getItem('luna_notes_v1') && active('scr-end'));
    // 설정의 기록 초기화(실제로 지우기) — 게임 기록은 지워지고 모드는 남는다
    f.src = '/index.html?r=9'; await sleep(200);
    await until(() => W().LUNA && E('btnContinue') && E('btnContinue').style.display !== 'none');
    E('btnContinue').click(); await until(() => active('scr-ep')); await throughStory();
    E('dockSettings').click(); await until(() => E('appSettings').classList.contains('on'));
    E('setReset').click(); await until(popupShown);
    [...D().querySelectorAll('#popup .pop-btn')].find(b => b.textContent.includes('지우기')).click();
    await sleep(400); await until(() => W().LUNA && E('btnNew') && active('scr-title'));
    log('settings: 초기화 — 게임 기록·적은 글은 지워지고 모드는 남음', W().localStorage.getItem('luna_save_v1') === null && W().localStorage.getItem('luna_notes_v1') === null && W().localStorage.getItem('luna_theme') === 'dark' && active('scr-title'));
    // 대비: 유리 위 글자 4.5:1 이상(다크·라이트). 흐림·채도 효과는 빼고 색만 겹쳐 계산한 근삿값
    for (const th of ['dark', 'light']) {
      W().localStorage.setItem('luna_theme', th); f.src = '/index.html?c=' + th; await sleep(200);
      await until(() => W().LUNA && E('btnNew') && D().documentElement.dataset.theme === th);
      const c = minContrast(th);
      log('contrast: ' + th + ' 유리 위 글자 최소 대비 4.5:1 이상', c.min >= 4.5, c.min.toFixed(2) + ' (' + c.where + ')');
    }
    // 전체 화면 모드(폰 세로·가로)와 기기 틀 모드(교실 노트북 높이)
    f.width = 375; f.height = 667; f.src = '/index.html?r=10'; await sleep(300);
    await until(() => W().LUNA && E('btnNew'));
    log('full: 좁은 화면 — 가짜 상태바·카메라 점·기기 테두리 없음', E('statusBar').offsetParent === null && D().querySelector('.cam-dot').offsetParent === null && W().getComputedStyle(D().querySelector('.device')).paddingTop === '0px');
    log('full: 가로 스크롤 0', D().documentElement.scrollWidth <= 375);
    f.width = 844; f.height = 390; await sleep(300);
    E('btnNew').scrollIntoView();
    log('full: 가로로 든 폰 — 전체 화면 모드 + 시작 버튼까지 스크롤로 닿음', E('statusBar').offsetParent === null && E('btnNew').getBoundingClientRect().bottom <= 391, String(E('btnNew').getBoundingClientRect().bottom));
    f.width = 1366; f.height = 650; await sleep(300);
    log('frame: 교실 노트북 높이 — 기기 틀이 보이고 잠금화면이 안 잘림', E('statusBar').offsetParent !== null && E('btnNew').getBoundingClientRect().bottom <= E('app').getBoundingClientRect().bottom && E('scr-title').scrollHeight <= E('scr-title').clientHeight + 1, E('scr-title').scrollHeight + '/' + E('scr-title').clientHeight);
    log('frame: 기기 높이 600~844 사이', (h => h >= 600 && h <= 844)(D().querySelector('.device').getBoundingClientRect().height));
    log('콘솔 오류 0(마지막 화면)', (W().__errs || []).length === 0, (W().__errs || []).join(' | '));
  } catch (e) { log('예외 발생', false, e.message); }
  out.textContent += 'PROBE-DONE\n';
  document.title = 'PROBE-DONE';
}
run();
</script>
